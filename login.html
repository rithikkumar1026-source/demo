<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    :root {
      --bg: #fff7ec;
      --card: #ffffff;
      --text: #2b2118;
      --muted: #7a6a5a;
      --accent: #e8590c;
      --accent-dark: #c44a08;
      --border: #e6d8c6;
      --error: #c92a2a;
      --success: #2b8a3e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: var(--card);
      width: 100%;
      max-width: 400px;
      padding: 32px 28px;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(43, 33, 24, 0.08);
    }

    .logo {
      display: block;
      max-width: 120px;
      max-height: 80px;
      margin: 0 auto 12px;
    }

    h1 {
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
    }

    input:focus {
      outline: 3px solid rgba(232, 89, 12, 0.3);
      border-color: var(--accent);
    }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 70px; }

    .toggle-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--accent-dark);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 8px;
    }

    .error-text {
      color: var(--error);
      font-size: 0.85rem;
      margin-top: 4px;
      min-height: 1em;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .row label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 400;
      margin: 0;
    }

    a { color: var(--accent-dark); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .btn {
      width: 100%;
      padding: 13px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn:hover { background: var(--accent-dark); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .message {
      margin-top: 16px;
      text-align: center;
      font-size: 0.95rem;
      min-height: 1.2em;
    }
    .message.error { color: var(--error); }
    .message.success { color: var(--success); }

    .footer-text {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <main class="login-card">
    <!-- Put your logo at images/logo.png, or delete this line -->
    <img class="logo" src="images/logo.png" alt="Shop logo" onerror="this.style.display='none'">

    <h1>Welcome back</h1>
    <p class="subtitle">Log in to manage your menu</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
        <div class="error-text" id="emailError"></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="toggle-btn" id="togglePassword">Show</button>
        </div>
        <div class="error-text" id="passwordError"></div>
      </div>

      <div class="row">
        <label><input type="checkbox" id="remember"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn" id="loginBtn">Log in</button>
      <div class="message" id="message" role="status"></div>
    </form>

    <p class="footer-text">New here? <a href="#">Create an account</a></p>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const message = document.getElementById('message');
    const loginBtn = document.getElementById('loginBtn');
    const toggleBtn = document.getElementById('togglePassword');

    // Show / hide password
    toggleBtn.addEventListener('click', function () {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleBtn.textContent = isHidden ? 'Hide' : 'Show';
    });

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'message ' + type;
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      emailError.textContent = '';
      passwordError.textContent = '';
      showMessage('', '');

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      let valid = true;

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailError.textContent = 'Enter a valid email address.';
        valid = false;
      }
      if (password.length < 6) {
        passwordError.textContent = 'Password must be at least 6 characters.';
        valid = false;
      }
      if (!valid) return;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        // ------------------------------------------------------------
        // DEMO ONLY: this page has no real login yet.
        // Replace this block with your real login, for example Supabase:
        //
        //   const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        //   if (error) throw error;
        //   window.location.href = '/dashboard.html';
        // ------------------------------------------------------------
        await new Promise(function (resolve) { setTimeout(resolve, 800); });

        showMessage('Login form works. Connect it to your backend to log in for real.', 'success');
      } catch (err) {
        showMessage(err.message || 'Login failed. Check your email and password.', 'error');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log in';
      }
    });
  </script>

</body>
</html>
