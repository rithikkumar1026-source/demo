<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <main class="register-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to your account</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
        <div class="error-text" id="emailError"></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="toggle-btn" id="togglePassword">Show</button>
        </div>
        <div class="error-text" id="passwordError"></div>
      </div>

      <button type="submit" class="btn" id="loginBtn">Log in</button>
      <div class="message" id="message" role="status" aria-live="polite"></div>
    </form>

    <p class="footer-text">New here? <a href="register.html">Create an account</a></p>
  </main>

  <script>
    const API_URL = 'http://localhost:5000';
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const message = document.getElementById('message');
    const loginBtn = document.getElementById('loginBtn');

    document.getElementById('togglePassword').addEventListener('click', function () {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      this.textContent = isHidden ? 'Hide' : 'Show';
    });

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      emailError.textContent = '';
      passwordError.textContent = '';
      message.textContent = '';
      message.className = 'message';

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      let valid = true;

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailError.textContent = 'Enter a valid email address.';
        valid = false;
      }
      if (password.length < 6) {
        passwordError.textContent = 'Password must be at least 6 characters.';
        valid = false;
      }
      if (!valid) return;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        const response = await fetch(API_URL + '/api/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });
        const data = await response.json().catch(function () { return {}; });

        if (!response.ok) {
          throw new Error(data.message || 'Could not log in.');
        }

        window.location.href = 'landing-page.html';
      } catch (error) {
        if (error instanceof TypeError) {
          message.textContent = 'Cannot reach the server. Make sure the backend is running.';
        } else {
          message.textContent = error.message || 'Could not log in.';
        }
        message.classList.add('error');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
